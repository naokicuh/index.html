<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cash Flow Mobile</title>
    <link rel="manifest" href="manifest.json">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- FontAwesome untuk Ikon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; overflow: hidden; }
        
        main {
            height: calc(100vh - 125px);
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-slate-950 dark:text-slate-100 min-h-screen flex flex-col transition-colors duration-200">

    <!-- HEADER / NAVBAR ATAS -->
    <header class="bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 sticky top-0 z-30 px-4 py-3 flex items-center justify-between shadow-xs h-[60px]">
        <div class="flex items-center space-x-3">
            <div id="headerAvatarContainer" class="w-9 h-9 rounded-full bg-emerald-500 text-white flex items-center justify-center font-bold overflow-hidden border-2 border-emerald-400 shadow-sm">
                <span id="headerAvatarText">U</span>
                <img id="headerAvatarImg" src="" alt="Profile" class="w-full h-full object-cover hidden">
            </div>
            <div>
                <h1 id="headerName" class="text-sm font-bold text-slate-900 dark:text-white leading-tight">Pengguna</h1>
                <p class="text-[10px] text-slate-500 dark:text-slate-400">Pencatatan Offline</p>
            </div>
        </div>
        <div class="flex items-center space-x-2">
            <!-- Pilihan Mata Uang / Kantong Aktif -->
            <select id="currencySelector" onchange="changeCurrency(this.value)" class="text-xs font-semibold bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 border border-slate-300 dark:border-slate-700 rounded-lg px-2 py-1 focus:outline-none">
                <option value="MYR">Kantong MYR (RM)</option>
                <option value="IDR">Kantong IDR (Rp)</option>
                <option value="USD">Kantong USD ($)</option>
                <option value="SGD">Kantong SGD (S$)</option>
            </select>
            <!-- Tombol Toggle Dark Mode Header -->
            <button onclick="toggleDarkMode()" class="w-8 h-8 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 flex items-center justify-center hover:bg-slate-200 dark:hover:bg-slate-700 transition">
                <i id="headerThemeIcon" class="fa-solid fa-moon text-xs"></i>
            </button>
        </div>
    </header>

    <!-- KONTEN UTAMA HALAMAN TERPISAH (TAB / SLIDE) -->
    <main class="flex-1 max-w-md w-full mx-auto p-4 pb-20">

        <!-- SLIDE 1: BERANDA / DASHBOARD CASHFLOW -->
        <section id="tab-dashboard" class="space-y-4">
            <!-- Kartu Saldo Utama Terpisah Per Mata Uang -->
            <div class="bg-gradient-to-br from-emerald-600 to-teal-700 text-white p-5 rounded-2xl shadow-lg relative overflow-hidden">
                <div class="flex justify-between items-center">
                    <p class="text-xs font-medium text-emerald-100 uppercase tracking-wider">Total Saldo Kantong <span id="activeCurrencyLabel">MYR</span></p>
                    <span id="badgeCurrencySymbol" class="bg-white/20 text-[10px] px-2 py-0.5 rounded-
